<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Released and boundary-aligned confidence probes</title>
  <desc id="desc">The released probe continues after a candidate answer and scores a mixed span. The boundary-aligned probe stops when the candidate box closes and scores only candidate tokens.</desc>
  <style>
    .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .node { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; }
    .candidate { fill: #eef6ff; stroke: #2563eb; stroke-width: 1.8; }
    .mixed { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.8; }
    .score { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.8; }
    .line { stroke: #475569; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
    .label { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; font-size: 18px; font-weight: 600; }
    .small { font-family: Arial, Helvetica, sans-serif; fill: #334155; font-size: 15px; }
    .heading { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; font-size: 21px; font-weight: 700; }
    .note { font-family: Arial, Helvetica, sans-serif; fill: #475569; font-size: 14px; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect class="panel" x="20" y="20" width="1160" height="180" rx="10"/>
  <text class="heading" x="50" y="58">Released probe</text>
  <text class="note" x="50" y="84">Confidence is measured after the answer has closed, over a mixed span.</text>
  <rect class="node" x="50" y="112" width="200" height="58" rx="7"/>
  <text class="label" x="150" y="139" text-anchor="middle">Reasoning prefix</text>
  <text class="small" x="150" y="159" text-anchor="middle">fixed checkpoint</text>
  <path class="line" d="M250 141 H328"/>
  <rect class="candidate" x="340" y="112" width="220" height="58" rx="7"/>
  <text class="label" x="450" y="139" text-anchor="middle">Candidate answer</text>
  <text class="small" x="450" y="159" text-anchor="middle">outer box closes</text>
  <path class="line" d="M560 141 H638"/>
  <rect class="mixed" x="650" y="112" width="220" height="58" rx="7"/>
  <text class="label" x="760" y="139" text-anchor="middle">Continued text</text>
  <text class="small" x="760" y="159" text-anchor="middle">post-answer tokens</text>
  <path class="line" d="M870 141 H948"/>
  <rect class="mixed" x="960" y="102" width="180" height="78" rx="7"/>
  <text class="label" x="1050" y="133" text-anchor="middle">Confidence</text>
  <text class="small" x="1050" y="154" text-anchor="middle">candidate + continued text</text>
  <rect class="panel" x="20" y="230" width="1160" height="180" rx="10"/>
  <text class="heading" x="50" y="268">Boundary-aligned probe</text>
  <text class="note" x="50" y="294">The trial stops at the completed outer box; BAC scores candidate tokens only.</text>
  <rect class="node" x="50" y="322" width="200" height="58" rx="7"/>
  <text class="label" x="150" y="349" text-anchor="middle">Reasoning prefix</text>
  <text class="small" x="150" y="369" text-anchor="middle">fixed checkpoint</text>
  <path class="line" d="M250 351 H328"/>
  <rect class="candidate" x="340" y="322" width="220" height="58" rx="7"/>
  <text class="label" x="450" y="349" text-anchor="middle">Candidate answer</text>
  <text class="small" x="450" y="369" text-anchor="middle">outer box closes</text>
  <path class="line" d="M560 351 H638"/>
  <rect class="score" x="650" y="322" width="125" height="58" rx="7"/>
  <text class="label" x="712" y="357" text-anchor="middle">STOP</text>
  <path class="line" d="M775 351 H853"/>
  <rect class="score" x="865" y="312" width="275" height="78" rx="7"/>
  <text class="label" x="1002" y="343" text-anchor="middle">BAC confidence</text>
  <text class="small" x="1002" y="364" text-anchor="middle">candidate tokens only</text>
</svg>
